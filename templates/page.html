<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns#">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>◆</text></svg>">
<style>
  :root {
    --bg: #fbfbfa; --fg: #1b1b1a; --muted: #6a6a67; --rule: #e3e3df;
    --accent: #2f5d50; --chip-bg: #eceae4; --code-bg: #f2f1ec;
    --measure: 42rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --fg: #e8e8e4; --muted: #9a9a95; --rule: #2c2e33;
      --accent: #7db8a4; --chip-bg: #23252a; --code-bg: #1d1f23;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.65 ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    padding: 0 1.25rem;
  }
  .wrap { max-width: var(--measure); margin: 0 auto; padding: 4rem 0 6rem; }
  a { color: var(--accent); text-underline-offset: 2px; }
  a:hover { text-decoration-thickness: 2px; }
  h1, h2, h3 { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.25; letter-spacing: -0.01em; }
  h1 { font-size: 2rem; margin: 0 0 .5rem; }
  h2 { font-size: 1.3rem; margin: 3rem 0 .75rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); }
  h3 { font-size: 1.05rem; margin: 2rem 0 .5rem; }
  .lede { color: var(--muted); font-size: 1.05rem; margin: 0 0 2.5rem; }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: .75rem 0; padding: 0; list-style: none; }
  .chips li {
    font: 500 .72rem/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em;
    background: var(--chip-bg); color: var(--muted);
    padding: .38rem .6rem; border-radius: 999px; white-space: nowrap;
  }
  .meta { color: var(--muted); font-size: .82rem; font-family: ui-sans-serif, system-ui, sans-serif; }
  blockquote {
    margin: 1.25rem 0; padding: .1rem 0 .1rem 1.1rem;
    border-left: 3px solid var(--rule); color: var(--muted);
  }
  code, pre { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-size: .875em; }
  code { background: var(--code-bg); padding: .12em .34em; border-radius: 3px; }
  pre { background: var(--code-bg); padding: 1rem; border-radius: 6px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  /* Wide content scrolls inside its own box; the page never scrolls sideways. */
  .scroll { overflow-x: auto; margin: 1.25rem 0; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: .5rem .7rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-family: ui-sans-serif, system-ui, sans-serif; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  img, svg { max-width: 100%; height: auto; }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 3rem 0; }
  .backlink { font-family: ui-sans-serif, system-ui, sans-serif; font-size: .85rem; margin-bottom: 2.5rem; display: inline-block; }
  footer { margin-top: 5rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: .8rem; font-family: ui-sans-serif, system-ui, sans-serif; }
  .mermaid { margin: 1.5rem 0; }
</style>
</head>
<body>
<main class="wrap">
{{BODY}}
<footer>
  {{FOOTER}}
</footer>
</main>
{{SCRIPTS}}
</body>
</html>
